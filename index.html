<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>明清女性诗人与作品网络</title><link rel="stylesheet" href="assets/style.css"></head>
<body>
<header><div><span class="eyebrow">MQWW · CBDB</span><h1>明清女性诗人与作品关系图谱</h1><p>女性人物、作品与可追溯关系的探索性视图</p></div><div class="stats"><b id="people-count">–</b> 人物 <b id="work-count">–</b> 作品 <b id="edge-count">–</b> 关系</div></header>
<section class="controls"><label>搜索人物 <input id="search" type="search" placeholder="姓名、MQWW 或 CBDB ID"></label><label>作品类型 <select id="work-type"><option value="">全部类型</option></select></label><label>选择作品 <select id="work-select"><option value="">全部作品</option></select></label><label>关系层 <select id="layer-select"><option value="all">全部层</option><option value="kin">CBDB 亲属关系</option><option value="assoc">CBDB 社会关系</option><option value="work_direct">作品直接著录</option><option value="work_via_poem">经诗作传递</option></select></label><label class="label-density">标签数量 <input id="label-density" type="range" min="0" max="4" step="1" value="1" aria-label="控制人物标签显示数量"><span id="label-density-value">核心 14</span></label><button id="reset">重置</button></section>
<main><section class="graph-wrap"><canvas id="graph" aria-label="人物、作品与关系的可交互图谱"></canvas><div id="loading">正在加载前端派生数据…</div><div class="legend"><span><i class="person"></i>女性</span><span>▲ 男性</span><span>◆ 未知（按女性主体保留）</span><span><i class="work"></i>作品</span><span><i class="kin"></i>亲属</span><span><i class="assoc"></i>社会关系</span><span><i class="work-direct"></i>作品直接著录</span><span><i class="via-poem"></i>经诗作传递</span></div><div class="graph-help">滚轮缩放 · 拖动空白平移 · 拖动人物调整位置 · 点击边查看证据</div></section><aside id="detail"><h2>详情</h2><p class="muted">点击人物、作品节点或关系边查看详情。</p></aside></main>
<footer><span id="status"></span></footer>
